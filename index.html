<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ShadowSim · Carrier Setup</title>
  <style>
    /* minimal, light, featureless */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #1e293b;
      line-height: 1.4;
      font-weight: 400;
    }

    /* simple card – no shadows, no borders, just spacing */
    .card {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 32px 24px 24px;
      /* featureless: no box-shadow, no border */
    }

    /* top row */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .name {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.2px;
      color: #0f172a;
    }

    .name span {
      font-weight: 300;
      color: #64748b;
    }

    .country-tag {
      font-size: 13px;
      font-weight: 400;
      color: #475569;
      background: #f1f5f9;
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* main text */
    .main h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #0f172a;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .main p {
      font-size: 14px;
      color: #64748b;
      font-weight: 400;
      max-width: 280px;
      line-height: 1.5;
    }

    /* timer */
    .timer-block {
      margin: 32px 0 24px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .timer-item {
      text-align: center;
      min-width: 64px;
    }

    .timer-number {
      font-size: 32px;
      font-weight: 500;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      color: #0f172a;
      line-height: 1;
      letter-spacing: -1px;
    }

    .timer-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 400;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* progress */
    .progress-wrap {
      margin: 24px 0 16px;
    }

    .progress-bar {
      height: 4px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #94a3b8;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
      font-weight: 400;
    }

    /* info line – very simple */
    .info-line {
      font-size: 13px;
      color: #64748b;
      margin: 20px 0 8px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      line-height: 1.5;
    }

    .info-line strong {
      font-weight: 500;
      color: #334155;
    }

    /* footer */
    .footer {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 20px;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- top: name + country -->
    <div class="top">
      <div class="name">SHADOW<span>SIM</span></div>
      <div class="country-tag" id="countryTag">Detecting…</div>
    </div>

    <!-- message -->
    <div class="main">
      <h1>Preparing carriers<br>in your area</h1>
      <p>Setting up SS7 gateways. This takes up to 5 hours.</p>
    </div>

    <!-- countdown -->
    <div class="timer-block">
      <div class="timer-item">
        <div class="timer-number" id="hours">05</div>
        <div class="timer-label">Hours</div>
      </div>
      <div class="timer-item">
        <div class="timer-number" id="minutes">00</div>
        <div class="timer-label">Minutes</div>
      </div>
      <div class="timer-item">
        <div class="timer-number" id="seconds">00</div>
        <div class="timer-label">Seconds</div>
      </div>
    </div>

    <!-- progress -->
    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text">
        <span>Carrier sync</span>
        <span id="progressPercent">0%</span>
      </div>
    </div>

    <!-- info -->
    <div class="info-line">
      <strong>Background process.</strong> Timer continues even if you close the app.
    </div>

    <!-- footer -->
    <div class="footer" id="footerRegion">Region</div>
  </div>

  <script>
  (function() {
    // ----- config -----
    const DURATION_MS = 5 * 60 * 60 * 1000; // 5 hours
    const STORAGE_START = 'shadowsim_start_v3';
    const STORAGE_FINISHED = 'shadowsim_finished_v3';

    // ----- DOM elements -----
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const countryTag = document.getElementById('countryTag');
    const footerRegion = document.getElementById('footerRegion');

    // Utility: Format ISO 2-letter country code into full English country name
    function formatCountryName(code) {
      if (!code || code.length !== 2) return null;
      try {
        const regionNames = new Intl.DisplayNames(['en'], { type: 'region' });
        return regionNames.of(code.toUpperCase()) || code.toUpperCase();
      } catch (e) {
        return code.toUpperCase();
      }
    }

    // Fetch helper with timeout
    async function fetchWithTimeout(url, ms = 4000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    // High-accuracy Country Detection with multi-provider fallback
    async function detectVisitorCountry() {
      // 1. Primary: country.is (fast, CORS-enabled, no key needed, returns caller's country code)
      try {
        const data = await fetchWithTimeout('https://api.country.is/');
        if (data && data.country) {
          const name = formatCountryName(data.country);
          if (name) return name;
        }
      } catch (e) {}

      // 2. Secondary: freeipapi.com (returns caller's country code and countryName)
      try {
        const data = await fetchWithTimeout('https://freeipapi.com/api/v1/json');
        if (data && (data.countryName || data.countryCode)) {
          return data.countryName || formatCountryName(data.countryCode);
        }
      } catch (e) {}

      // 3. Tertiary: ipapi.co JSON endpoint
      try {
        const data = await fetchWithTimeout('https://ipapi.co/json/');
        if (data && (data.country_name || data.country)) {
          return data.country_name || formatCountryName(data.country);
        }
      } catch (e) {}

      // 4. Fallback: Parse timezone locale if network APIs fail (offline/adblocker)
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        const region = tz.split('/')[0];
        const city = tz.split('/')[1] ? tz.split('/')[1].replace(/_/g, ' ') : '';

        if (city) return city;
        if (region) return region;
      } catch (e) {}

      return 'Unknown';
    }

    async function updateCountry() {
      countryTag.textContent = 'Detecting…';
      footerRegion.textContent = 'Detecting…';

      const country = await detectVisitorCountry();
      countryTag.textContent = country;
      footerRegion.textContent = country;
    }

    // ----- countdown logic (persistent) -----
    function getStart() {
      const stored = localStorage.getItem(STORAGE_START);
      if (stored) {
        const ts = parseInt(stored, 10);
        if (!isNaN(ts)) return ts;
      }
      const now = Date.now();
      localStorage.setItem(STORAGE_START, now.toString());
      return now;
    }

    function isFinished() {
      return localStorage.getItem(STORAGE_FINISHED) === 'true';
    }

    function markFinished() {
      localStorage.setItem(STORAGE_FINISHED, 'true');
      const expired = Date.now() - DURATION_MS;
      localStorage.setItem(STORAGE_START, expired.toString());
    }

    function updateTimer(remainingMs) {
      const totalSec = Math.max(0, Math.floor(remainingMs / 1000));
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;

      hoursEl.textContent = String(hrs).padStart(2, '0');
      minutesEl.textContent = String(mins).padStart(2, '0');
      secondsEl.textContent = String(secs).padStart(2, '0');

      const elapsed = DURATION_MS - remainingMs;
      const pct = Math.min(100, Math.max(0, (elapsed / DURATION_MS) * 100));
      progressFill.style.width = pct + '%';
      progressPercent.textContent = Math.floor(pct) + '%';
    }

    function tick() {
      if (isFinished()) {
        updateTimer(0);
        return;
      }

      const start = getStart();
      const now = Date.now();
      const elapsed = now - start;
      const remaining = DURATION_MS - elapsed;

      if (remaining <= 0) {
        markFinished();
        updateTimer(0);
        return;
      }

      updateTimer(remaining);
    }

    function initCountdown() {
      if (!localStorage.getItem(STORAGE_START)) {
        localStorage.setItem(STORAGE_START, Date.now().toString());
        localStorage.removeItem(STORAGE_FINISHED);
      } else {
        const start = parseInt(localStorage.getItem(STORAGE_START), 10);
        if (!isNaN(start) && (Date.now() - start) >= DURATION_MS && !isFinished()) {
          markFinished();
        }
      }
      tick();
      setInterval(tick, 1000);
    }

    // ----- initialization -----
    initCountdown();
    updateCountry();
  })();
</script>
</body>
</html>
